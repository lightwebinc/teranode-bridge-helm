{{- $c := .Values.config -}}
{{- if ne ($c.mode | default "all") "sink" }}
{{- /* The pull-back address. Teranode fetches every announced subtree and block
       from whatever config.advertise names, so that value and this Service must
       resolve to the same place — a Service of its own keeps the cluster-facing
       exposure independent of the delivery-facing one, and gives the address
       something stable to be. mode=sink serves no pulls, so it gets no
       Service. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "teranode-bridge.fullname" . }}-retrieval
  labels:
    {{- include "teranode-bridge.labels" . | nindent 4 }}
  {{- with .Values.service.retrieval.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.retrieval.type }}
  {{- with .Values.service.retrieval.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- with .Values.service.retrieval.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    {{- include "teranode-bridge.selectorLabels" . | nindent 4 }}
  ports:
    - name: retrieval
      port: {{ include "teranode-bridge.port" $c.retrievalListen | int }}
      targetPort: retrieval
      protocol: TCP
{{- end }}
