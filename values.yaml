# Default values for teranode-bridge.
#
# The binary is FLAG-ONLY — no env fallback, no config file — so the Deployment
# renders `args:` from `config` below. Empty string / 0 / "0s" / false are
# OMITTED from the arg vector so the binary's own default applies. Anything not
# modelled here goes verbatim into extraArgs.
#
# FOUR EXCEPTIONS render unconditionally, because for them the zero value MEANS
# something the omitted form can never express (omission = "use the binary
# default", which for all four is the non-zero one):
#   config.submitter   false = do not hold the submitter role
#   config.txRetries   0     = no retries at all
#   config.statsEvery  "0s"  = no periodic stats block
#   metrics.enabled    false = no metrics/health listener at all
# Each is called out again at its key.

replicaCount: 1
# One replica is the intended shape, and scaling out is not free — read
# README "Scaling" first. Two facts drive it:
#   1. The object cache is IN-PROCESS. A pushed subtree lives only on the bridge
#      that received it, and that bridge stamps ITSELF into the announcement. Put
#      N replicas behind one Service and (N-1)/N of the cluster's pulls land on a
#      replica that never saw the object: 404, and the cluster falls back to its
#      ordinary peer fetch (slower, not lost).
#   2. Exactly one bridge per cluster may hold the reverse-path submitter role.
#      The chart REFUSES to install replicaCount > 1 with the reverse path
#      enabled and config.submitter true, rather than quietly double-publishing
#      every locally produced block onto the object plane.
# Scale by adding releases, each with its own config.advertise — not replicas.

image:
  repository: ghcr.io/lightwebinc/teranode-bridge
  pullPolicy: IfNotPresent
  tag: "" # defaults to .Chart.appVersion

# PUBLIC image — normally empty. Present for mirrored/private registries.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# Matches the distroless/static:nonroot image (uid 65532), and keeps holding
# even if the image is overridden.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# The bridge writes nothing to disk and needs no capability: it opens ordinary
# TCP sockets, all above 1024. Move a lane below 1024 and you must add
# NET_BIND_SERVICE here — the image runs as nonroot and the bind will fail
# otherwise, at startup, with the lane never reaching "bound" (so /readyz stays
# 503 rather than the pod looking healthy and deaf).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# pod  = ordinary CNI; the lanes and the retrieval plane are reached through the
#        Services below. Right when the Teranode cluster and the delivery side
#        can both route to cluster Services.
# host = hostNetwork; the pod binds the node's own addresses. Right when the
#        cluster (or the delivery tunnel) can only reach a node address — the
#        common case, since the bridge is a landing tier in front of a cluster
#        that lives on a LAN, not in this k8s cluster. In host mode the ports in
#        `config` are HOST ports: only one bridge per node, and the rollout must
#        stop the old pod before starting the new one (see updateStrategy).
networking:
  mode: pod # pod | host
  host:
    dnsPolicy: ClusterFirstWithHostNet

# Empty => RollingUpdate for networking.mode=pod, Recreate for host (a rolling
# update cannot bind the same host ports twice, so the new pod would sit in
# CrashLoopBackOff until the old one goes away). Set explicitly to override.
updateStrategy: {}

config:
  # ── Delivery lanes (inbound, one TCP listener per object class) ────────────
  # The streams are bare — no length prefix, no type tag — so each lane carries
  # exactly one class and objects are delimited by their own structure. Crossing
  # two classes onto one lane shows up as `lane stats dropped`, not as silence.
  # [::] accepts on whatever address the delivery side reaches this pod on; pin
  # to a specific address once the deployment has settled.
  # The tx lane is BRC-30 EF ONLY: a standard (BRC-12) transaction is refused at
  # the lane and counted in teranode_bridge_lane_objects_rejected_total{lane="tx"} — sustained
  # growth there means a sender is emitting the wrong format, not a sick cluster.
  txListen: "[::]:8725" # -tx-listen      transactions, BRC-30 extended format
  subtreeListen: "[::]:9143" # -subtree-listen BRC-143 push frames
  blockListen: "[::]:9144" # -block-listen   BRC-144 push frames
  # -max-object: per-object ceiling in bytes, every lane. 0 = the objfmt codec
  # default (64 MiB). Only raise it if a legitimate object exceeds that.
  maxObject: 0

  # ── Retrieval plane (the CLUSTER dials this) ───────────────────────────────
  # Teranode learns of a subtree/block by announcement plus pull: the bridge
  # announces {hash, URL} and the cluster fetches the bytes from that URL. This
  # is the server that answers.
  retrievalListen: "[::]:9145" # -retrieval-listen (bind address)

  # -advertise: the base URL the CLUSTER should dial. REQUIRED unless mode=sink.
  # This is the single value that silently breaks all subtree and block ingest
  # when it is wrong: announcements keep succeeding, pulls never arrive, and the
  # only symptom is `retrieval stats` flat against a rising `announce stats`.
  #
  #   * It is what the CLUSTER can dial — not necessarily what the bridge binds.
  #     Binding [::]:9145 and advertising a routable address is the normal shape.
  #   * BASE URL ONLY — do NOT append apiPrefix. The announced URL is
  #     advertise + apiPrefix; putting /api/v1 in both doubles the path and the
  #     cluster's subtree/block pulls 404. The chart REFUSES to install that.
  #   * No trailing slash (harmless — it is trimmed — but write it clean).
  #   * Scheme required: http:// or https://.
  #
  # e.g. "http://[2001:db8:3f::1]:9145" (host mode, node address)
  #      "http://teranode-bridge-retrieval.bsv-mcast.svc.cluster.local:9145"
  #        (pod mode — ONLY if the cluster resolves this k8s cluster's DNS)
  # helm install prints the exact URL that will be announced; check it.
  advertise: ""

  # -api-prefix: path prefix the retrieval plane serves on. Must match what the
  # cluster expects — it concatenates the announced base URL with
  # "/subtree/{hash}" verbatim, and its own asset service mounts under /api/v1.
  # There is no reason to change this against a stock Teranode.
  apiPrefix: "/api/v1"

  # ── Cluster ingest targets ─────────────────────────────────────────────────
  # Lists, not comma strings: each element renders as its own repeated flag, so
  # `--set config.propagation[0]=...` needs no comma escaping and `kubectl
  # describe pod` shows one endpoint per line.
  # Both are REQUIRED unless mode=sink. At startup the bridge probes
  # {propagation}/health and pings the brokers; NEITHER failure is fatal (the
  # cluster may still be starting), so a typo here surfaces later as `failed`
  # submits or `announce failures`, not as a crash.
  propagation: [] # -propagation e.g. ["http://192.0.2.10:20833"] (round-robined per tx)
  # The brokers must advertise a listener that resolves FROM THIS POD. A
  # mis-advertised listener passes the ping and then fails at produce time.
  kafka: [] # -kafka       e.g. ["192.0.2.10:19092"]

  # ── Announcements ──────────────────────────────────────────────────────────
  # Must match the cluster's own topic configuration; these defaults match
  # Teranode's single-node defaults. An announcement produced to a topic nobody
  # consumes is silently ineffective — the object is never pulled, never
  # validated, and only shows as a growing announce/retrieval gap.
  subtreeTopic: "subtrees-teranode1" # -subtree-topic
  blockTopic: "blocks-teranode1" # -block-topic
  # -peer-id: REQUIRED when announcements are configured (the chart refuses an
  # empty value at install time). Set a SYNTHETIC valid-format libp2p id
  # (12D3KooW…) derived from a fresh ed25519 key and registered with no p2p
  # service. This inverts this chart's earlier guidance, which was wrong at
  # teranode 1cca625 and caused a verified wedge: with an empty id, catchup
  # substitutes the announce URL, asks THIS bridge for the header chain, 404s,
  # and circuit-breaks the cluster out of recovery. An unregistered id makes
  # the catchup gate divert chain sync to real libp2p peers while every
  # delivery gate (bans only) keeps pulling objects from the bridge. One id per
  # bridge instance; never reuse a real peer's. Watch
  # btb_retrieval_unserved_route_total{class="chain_sync"} — sustained growth
  # means the divert has regressed on a cluster upgrade.
  peerId: ""

  # ── Reverse path (cluster → object plane) ──────────────────────────────────
  # Disabled unless blockchain is set; ignored entirely in mode=sink. Setting
  # blockchain REQUIRES localAsset and edgeIngress (the chart rejects the
  # incomplete set at install time rather than letting the binary exit 2 into a
  # crashloop).
  # -blockchain: cluster blockchain gRPC host:port, e.g. "192.0.2.10:20087".
  # The connection is PLAINTEXT AND UNAUTHENTICATED — keep it on a trusted LAN.
  blockchain: ""
  # -local-asset: cluster asset base URL INCLUDING its API prefix, e.g.
  # "http://192.0.2.10:20090/api/v1". The easy thing to get backwards: unlike
  # advertise (which the chart appends apiPrefix to), this one is dialled exactly
  # as given, so it carries the cluster's own prefix.
  localAsset: ""
  # -edge-ingress: object-plane ingress host for upward submits, typically
  # reachable only over the delivery link.
  edgeIngress: ""
  edgeSubtreePort: 8726 # -edge-subtree-port BRC-143 subtree submits
  edgeBlockPort: 8727 # -edge-block-port   BRC-144 block submits

  # -submitter: hold the submitter role. EXACTLY ONE bridge per class per cluster
  # may hold it — two submitters publish the same block twice onto the object
  # plane. RENDERED UNCONDITIONALLY as -submitter=<value>: the binary default is
  # true, and a bare flag can only turn something ON, so the omit-when-false form
  # would make `submitter: false` a silent no-op.
  # false still connects and still runs the origin filter (remote_skipped keeps
  # counting) but publishes nothing and fetches no assets — a hot spare whose
  # promotion is a flag flip and a restart.
  submitter: true

  # -mine-tag: this cluster's coinbase_arbitrary_text (e.g. "/teranode1/").
  # STRONGLY RECOMMENDED whenever the reverse path is on. Blockchain
  # notifications carry no origin, so a block this cluster learned over libp2p
  # BEFORE the fabric delivered it looks locally produced — without the tag the
  # reverse path republishes a remote block upward with false attribution. With
  # it, only blocks whose in-band coinbase carries the tag go up; the rest count
  # in teranode_bridge_reverse_skipped_total{reason="foreign_origin"}. The check is derived
  # from block content, so it survives a restart (which wipes the seen-registry).
  # Needs no Teranode change: coinbase_arbitrary_text is existing per-node
  # configuration — give each cluster a distinct tag and repeat it here.
  mineTag: ""

  # ── Blockchain connection: transport security and liveness ────────────────
  # security_level_grpc is a GLOBAL Teranode setting: a non-zero value wraps
  # EVERY Teranode gRPC listener, blockchain included, in TLS. A plaintext dial
  # then cannot connect at all — and the failure is partial in the worst way,
  # because the delivery lanes, announce and retrieval keep working while only
  # the reverse path dies as an endless "subscribe failed, retrying".
  #
  #   0  plaintext (Teranode's default)
  #   1  TLS, server certificate NOT verified. Upstream's own comment calls this
  #      MITM-exploitable by design — it stops passive eavesdropping, nothing
  #      more. This is the level that matters in practice.
  #   2  TLS; present a client cert and verify the server against a CA
  #   3  as 2 client-side; the server additionally requires the client cert
  #
  # Levels 2-3 need all three files below. Note that no Teranode CLIENT call
  # site populates its own cert paths, so a cluster at level 2 or 3 has broken
  # inter-service gRPC independently of the bridge.
  blockchainSecurityLevel: 0
  blockchainCaCert: "" # -blockchain-ca-cert  CA signing the cluster's server cert
  blockchainCert: "" #    -blockchain-cert     client cert presented to the cluster
  blockchainKey: "" #     -blockchain-key      key for blockchainCert

  # Keepalive is what stops the reverse path WEDGING. grpc-go's client default
  # is to never ping; the connection crosses a tunnel, and a silently dropped
  # path (WireGuard rekey, conntrack eviction, firewall state loss) does not
  # close the socket — Recv blocks forever and the reconnect loop, entered only
  # on a Recv error, never runs. The cluster's own keepalive tears down its half
  # without the client noticing.
  #
  # MUST be >= the cluster's grpc_server_min_ping_time_seconds (default 30s) or
  # the server answers GOAWAY too_many_pings, which the reconnect loop retries —
  # a liveness mechanism turned into a ping storm. Values below 10s are raised
  # to 10s (grpc-go's floor); the bridge warns when it does that.
  blockchainKeepalive: "30s"
  blockchainKeepaliveTimeout: "20s"
  # Ping with no stream open, matching grpc_permit_without_stream. Set false if
  # the cluster sets it false, or it will GOAWAY between reconnects.
  blockchainKeepaliveWhenIdle: true

  # -cluster-poll: how often to read the cluster's FSM state and tip height over
  # the blockchain connection the reverse path already holds. "0s" disables it;
  # it is rendered only when blockchain is set.
  #
  # Advisory only — the bridge announces and submits identically whatever state
  # the cluster is in, because the cluster is unmodified and decides for itself.
  # It exists because the most common degraded case otherwise has no visible
  # cause from the bridge's own metrics: announcements succeed, pulls never
  # follow, and every bridge counter looks healthy. Publishes
  # teranode_bridge_cluster_fsm_state and teranode_bridge_cluster_block_height,
  # and reports both under BlockchainFSM in /health.
  clusterPoll: "15s"

  # ── Transaction pipeline ───────────────────────────────────────────────────
  # The tx lane never submits synchronously: objects are enqueued to a batching
  # pipeline that ships them on propagation's POST /txs. A full queue blocks the
  # lane, which closes the TCP window — that backpressure is what bounds memory
  # when the cluster is slower than the fabric, so do not "fix" it with a bigger
  # batch.
  # -tx-batch: txs per batch, clamped to 1023 (the server cap is 1024, but a
  # batch of exactly 1024 is fully processed and THEN answered 400 — see the
  # binary's -tx-batch help). NOTE: 0 does NOT mean per-tx POST /tx — the
  # pipeline normalises anything <= 0 back to 512.
  txBatch: 512
  # -tx-batch-bytes: batch body ceiling, clamped to 30 MiB to stay under the
  # server's 32 MiB.
  txBatchBytes: 8388608
  # -tx-linger: max age of a non-full batch — the added latency when quiet.
  txLinger: "2ms"
  # -tx-inflight: concurrent batch requests. throughput ≈ inflight × batch / RTT.
  txInflight: 4
  # -tx-builders: parallel builders; power of two, ≤16 (anything else is rounded
  # DOWN, so 6 silently becomes 4 — the schema rejects it instead). Txs route to
  # a builder by txid, so a parent and its child usually land in the same batch,
  # which the pipe then seals: propagation refuses a request holding both.
  txBuilders: 4
  # -tx-retries: per-tx retries for failures that resolve with time (a missing
  # parent from a cross-builder race). RENDERED UNCONDITIONALLY: 0 means "no
  # retries", which omission would turn back into the binary's 3.
  txRetries: 3

  # ── Cache ──────────────────────────────────────────────────────────────────
  # This is a cache, not a store of record. Size the TTL against VALIDATION LAG
  # (seconds), not retention: an entry evicted before the cluster pulls it is a
  # 404 and the cluster falls back to its ordinary peer path — degraded latency,
  # not lost data. Watch `cache evicted` and `retrieval miss` together; rising
  # miss against flat evicted points at a topic or -advertise problem instead.
  # -cache-bytes: PER CACHE, and two are created (objects and transactions), so
  # the process ceiling is TWICE this — budget resources.limits.memory for that,
  # not for the number written here.
  cacheBytes: 1073741824
  cacheTtl: "10m" # -cache-ttl

  # ── Process ────────────────────────────────────────────────────────────────
  # -mode: all = full bridge. sink = receive, parse, verify and count only, with
  # NO cluster targets: no propagation submitter, no Kafka producer, no retrieval
  # plane, no reverse path. Lanes still run and still enforce framing, so sink is
  # how you burn in a delivery slot before a cluster exists, or separate
  # object-plane faults from cluster-side ones.
  mode: "all" # all | sink
  # -stats-every: interval between stats blocks. RENDERED UNCONDITIONALLY:
  # "0s" disables periodic stats (a final block is still logged at shutdown),
  # which omission would turn back into the binary's 1m.
  statsEvery: "1m"
  # -metrics-addr: HTTP listener for /metrics, /healthz, /readyz, /loglevel.
  # The probes below hang off this listener — see metrics.enabled to turn the
  # whole thing off (setting this to "" here would NOT: an empty value is
  # omitted and the binary default [::]:9146 would apply).
  metricsAddr: "[::]:9146"
  logLevel: "info" # -log-level  debug|info|warn|error; also POST /loglevel + SIGHUP
  # -log-format: text (stderr) | json (stdout). The binary defaults to text only
  # because the integration demo greps its log lines; set json for anything that
  # ships to log aggregation, which is most of what this chart deploys.
  logFormat: "text"
  # -instance-id: service.instance.id shared by logs and metrics so the two
  # join. Empty defaults to hostname, which in a pod is the pod name — already
  # the right answer.
  instanceId: ""
  debug: false # -debug: deprecated alias for -log-level=debug

# Appended verbatim after every rendered flag, for what is not modelled above.
# It can also override: a repeated ordinary flag takes the LAST value, while
# -propagation and -kafka accumulate (they are repeatable by design). Overriding
# this way hides the real value from `helm get values`, so prefer the key.
extraArgs: []

# The binary reads NO environment variable. This is for the Go runtime
# (GOMEMLIMIT, GOMAXPROCS) and for values you want to reference from extraArgs
# via kubelet's $(VAR) expansion.
extraEnv: []

# Ports are DERIVED from the config.*Listen addresses — one source of truth, so
# a Service port can never drift from what the process actually binds.
service:
  # Delivery lanes (tx/subtree/block) + metrics. Its callers are on the delivery
  # side of the fabric.
  type: ClusterIP
  annotations: {}
  # The retrieval plane gets its OWN Service because its caller is the other
  # side entirely — the Teranode cluster, dialling back in — and that side
  # usually needs a different exposure (a fixed LoadBalancer address, or a node
  # address its LAN routes). Whatever address this resolves to is what
  # config.advertise must name.
  retrieval:
    type: ClusterIP
    annotations: {}
    loadBalancerIP: ""
    # Local preserves the client source address and avoids a second hop; it
    # requires the pulling cluster to reach a node that actually runs a pod.
    externalTrafficPolicy: ""

metrics:
  # false renders -metrics-addr= (explicitly empty) to switch off the listener
  # entirely — /metrics, /health*, /healthz, /readyz, POST /loglevel and
  # /debug/pprof all go with it, and so do the probes below, which have nowhere
  # else to point.
  enabled: true
  path: /metrics

  # Series are teranode_bridge_* — the Namespace/Subsystem pair that names every
  # Teranode metric, so a bridge lands on the same grid as the cluster it fronts.
  # true ALSO emits every pre-existing series under its old btb_ name, so
  # dashboards written before the rename keep working through the cutover. Set
  # false once they are migrated; the alias is scheduled for removal in the
  # release after next. Metrics introduced with the new naming are never aliased.
  legacyPrefix: true

  # Per-object size histogram on the TX lane. Off by default: the lane bytes
  # counter already gives the mean, and at megatransaction-per-second rates a
  # bucketed observation per object is real work on the read path. The subtree
  # and block lanes always observe it — orders of magnitude lower rate, and a
  # genuinely informative distribution.
  txSizeHistogram: false

  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    metricRelabelings: []

  # Alert rules. Requires the Prometheus Operator. The defaults are the
  # expressions from docs/references/prometheusMetrics.md; `additionalRules` is
  # appended verbatim, and `rules: []` replaces the built-in set entirely.
  prometheusRule:
    enabled: false
    labels: {}
    # Cluster identity for the submitter-role invariant. Both alerts sum
    # teranode_bridge_submitter_active across the bridges in front of ONE
    # cluster, so this must select exactly that set — a fleet-wide sum would
    # report every extra cluster as a double-submitter.
    clusterSelectorLabel: cluster
    rules: []
    additionalRules: []

# Dependency health, reported by /health, /health/readiness and
# /health/liveness in the same JSON shape Teranode uses.
health:
  # true fails readiness when ANY dependency is down — Teranode's all-or-nothing
  # CheckAll behaviour.
  #
  # Off by default, and the reason is worth reading before turning it on: the
  # retrieval plane serves out of a local cache, so a bridge whose Kafka is
  # unreachable still answers every pull for objects it has ALREADY announced.
  # Kafka, propagation and the asset service are shared by every bridge in front
  # of a cluster, so gating on them removes all of those bridges from the
  # retrieval Service at the same instant — stranding exactly those fetches, and
  # turning a degraded announce path into lost objects (Teranode does not retry
  # a failed subtree fetch).
  #
  # With strict off, only conditions THIS pod alone can be in gate readiness:
  # its delivery lanes and its retrieval listener. Everything else is reported
  # in the body but does not fail the aggregate.
  strict: false

# OpenTelemetry tracing. Off by default, as upstream. Even when off the W3C
# propagator is installed, so incoming trace context is parsed and forwarded
# rather than dropped — a disabled bridge declines to contribute to a trace, it
# does not break one.
#
# The boundary that matters most is the retrieval plane: the cluster's fetch
# happens INSIDE its block-validation span, so without extraction there "why was
# this block slow to validate" dead-ends at the bridge.
tracing:
  enabled: false
  # Point at the same collector the cluster uses, or traces land in two places.
  collectorUrl: "http://localhost:4318"
  # Head sampling for ROOT spans only; child spans inherit the parent decision,
  # so a sampled cluster trace stays sampled across the bridge.
  sampleRate: 0.01

# Profile rates. Both default to 0, which is the Go default: the endpoints
# exist either way, but return an EMPTY profile rather than an error — which
# reads as "no contention" during exactly the investigation that needs the
# opposite answer. Neither is free; turn one on for a specific investigation.
profiling:
  blockProfileRate: 0
  mutexProfileFraction: 0

# /readyz turns 200 once EVERY lane is bound — before that the bridge cannot
# accept delivery, so gate anything that steers traffic on readiness, not on the
# pod merely running. /healthz is always 200: it proves the process is alive,
# nothing more, which is exactly what a liveness probe should assert.
#
# The paths are configurable but the defaults are deliberate:
#
#   * readiness stays on /readyz, NOT /health/readiness. /readyz is the failover
#     contract — a standby bridge polls the PRIMARY's /readyz to decide whether
#     to promote itself (config.submitterProbe). Pointing k8s readiness at the
#     dependency-aware route is fine on its own, but the two must not be
#     confused: a shared-dependency blip that both bridges see would otherwise
#     look like the primary dying, and two submitters is worse than a late one.
#   * liveness stays on /healthz. /health/liveness returns the same verdict with
#     a richer body; either works, and neither probes dependencies.
probes:
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# Memory is dominated by the two caches (2 × config.cacheBytes at the ceiling)
# plus in-flight batches, so a limit below that budget gets the pod OOM-killed
# mid-validation-window. These are a starting point for the 1 GiB default with
# headroom; raise both together with cacheBytes.
resources:
  requests:
    cpu: 500m
    memory: 2560Mi
  limits:
    cpu: "4"
    memory: 3Gi

# Long enough for in-flight batches and a streaming block pull to finish.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
topologySpreadConstraints: []

# With the default single replica a PDB of minAvailable: 1 blocks node drains
# outright. Enable it only alongside a scaled-out, submitter: false pull tier.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Fail-closed: enabling the policy with an empty `from` list for a port admits
# NO peers on it. The three ports have three different audiences, so they are
# separate keys rather than one blanket rule — the delivery side has no business
# reaching the retrieval plane, and the cluster none reaching the lanes.
# Ignored under networking.mode=host (host traffic never enters the pod network;
# restrict it with the node firewall).
networkPolicy:
  enabled: false
  laneIngressFrom: [] # tx/subtree/block — the delivery side
  retrievalIngressFrom: [] # retrieval — the Teranode cluster
  metricsIngressFrom: [] # metrics — Prometheus
